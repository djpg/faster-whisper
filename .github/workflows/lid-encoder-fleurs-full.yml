name: LID encoder V2 - FLEURS 102 languages

on:
  push:
    branches:
      - perf/reuse-lid-asr-encoder-v2-fleurs
    paths:
      - benchmark/lid_encoder_fleurs_full.py
      - .github/workflows/lid-encoder-fleurs-full.yml
  workflow_dispatch:
    inputs:
      shards:
        description: "Comma-separated shard IDs (1-34); empty runs all"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "4"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      revisions: ${{ steps.plan.outputs.revisions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -e . ctranslate2==4.9.1 numpy==2.4.6 av==18.1.1 onnxruntime==1.32.0 tokenizers==0.23.3 huggingface_hub==2.4.0 pyarrow==26.0.1
      - id: plan
        env:
          FLEURS_SHARDS: ${{ inputs.shards || '' }}
          FLEURS_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: python benchmark/lid_encoder_fleurs_full.py --plan

  evaluate:
    needs: plan
    runs-on: ubuntu-24.04
    name: FLEURS ${{ matrix.shard }} - ${{ matrix.locales }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      LOCALES: ${{ matrix.locales }}
      REVISIONS: ${{ needs.plan.outputs.revisions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install same inference dependencies as preliminary benchmark
        run: |
          python -m pip install -e . ctranslate2==4.9.1 numpy==2.4.6 av==18.1.1 onnxruntime==1.32.0 tokenizers==0.23.3 huggingface_hub==2.4.0 pyarrow==26.0.1
      - name: Record runner and dependencies
        run: |
          lscpu
          free -h
          python -m pip freeze
      - name: Evaluate up to 50 short test samples per locale with both models
        run: |
          python benchmark/lid_encoder_fleurs_full.py \
            --locales "$LOCALES" --revisions "$REVISIONS" --samples 50
