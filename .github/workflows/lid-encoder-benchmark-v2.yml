name: LID encoder reuse V2

on:
  push:
    branches:
      - perf/reuse-lid-asr-encoder-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Allow a loader-only repair to run quality without repeating speed.
        mode: ${{ fromJSON(github.event_name == 'push' && contains(github.event.head_commit.message, '[quality-only]') && '["quality"]' || '["speed","quality"]') }}
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install pyarrow
      - name: CPU information
        run: |
          lscpu
          free -h
          python -m pip freeze
      - name: Regression tests
        if: matrix.mode == 'speed'
        run: python -m pytest -v tests/test_lid_encoder_reuse.py tests/test_transcribe.py
      - name: Compare V1 and V2
        run: |
          python benchmark/lid_encoder_reuse_v2.py \
            --baseline fd4501da08f28840b0306e734a3374c9645345e1 \
            --mode ${{ matrix.mode }} --models tiny small --repeats 5 --samples 10
