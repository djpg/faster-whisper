name: LID encoder reuse benchmark

on:
  push:
    branches:
      - perf/reuse-lid-asr-encoder
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: CPU information
        run: |
          lscpu
          free -h
          python -m pip freeze
      - name: Regression tests
        run: python -m pytest -v tests/test_lid_encoder_reuse.py
      - name: Baseline versus optimized
        run: |
          python benchmark/lid_encoder_reuse.py \
            --baseline 8297f210090a59798489300c87003777a49cebef \
            --models tiny small --repeats 5 --warmup 2
